{% macro field(label,name,val,err,type='text',attrs='',full=False) %}
<div class="{{ 'full' if full }} {{ 'bad' if err.get(name) }}"><label>{{ label }}</label><input type="{{ type }}" name="{{ name }}" value="{{ val or '' }}" {{ attrs|safe }}>{% if err.get(name) %}<div class="err">{{ err[name] }}</div>{% endif %}</div>
{% endmacro %}
